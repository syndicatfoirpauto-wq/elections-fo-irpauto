media:
  input: actifs
  output: /elections-fo-irpauto/actifs

content:
  - name: accueil
    label: Accueil et liens
    type: file
    path: contenu/accueil.json
    format: json
    fields:
      - name: titre
        label: Titre principal
        type: string
      - name: sous_titre
        label: Sous-titre
        type: string
      - name: introduction
        label: Texte d'introduction
        type: text
      - name: lien_profession_foi
        label: Lien vers la profession de foi
        type: string
      - name: lien_video
        label: Lien vers la video
        type: string

  - name: engagements
    label: Nos engagements
    type: file
    path: contenu/engagements.json
    format: json
    fields:
      - name: introduction
        label: Introduction
        type: text
      - name: priorites
        label: Priorites FO
        type: object
        list: true
        fields:
          - name: titre
            label: Titre
            type: string
          - name: description
            label: Description
            type: text

  - name: bilan
    label: Bilan du mandat
    type: file
    path: contenu/bilan.json
    format: json
    fields:
      - name: introduction
        label: Introduction
        type: text
      - name: actions
        label: Actions et avancees
        type: object
        list: true
        fields:
          - name: titre
            label: Titre
            type: string
          - name: description
            label: Description
            type: text

  - name: equipe
    label: Notre equipe
    type: file
    path: contenu/equipe.json
    format: json
    fields:
      - name: introduction
        label: Presentation de l'equipe
        type: text
      - name: candidats
        label: Candidats
        type: object
        list: true
        fields:
          - name: nom
            label: Nom affiche
            type: string
          - name: college
            label: College electoral
            type: select
            options:
              values:
                - Employes
                - Agents de maitrise
                - Cadres
          - name: statut
            label: Liste
            type: select
            options:
              values:
                - Titulaire
                - Suppleant
          - name: site
            label: Site
            type: string
          - name: photo
            label: Photo
            type: image
